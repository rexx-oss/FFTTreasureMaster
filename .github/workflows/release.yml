name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Build
      id: publish
      run: ./Publish.ps1

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.5.2
        name: FFT Treasure Master — Compatibility Patch
        body: |
          Compatibility fix for the **September 17, 2026 update (Build 24304444 — Denuvo Removal)** and **Nenkai's Mod Loader 1.7.3+**.

          ### Credits:
          * **Original Mod:** [prawl/FFTTreasureMaster](https://github.com/prawl/FFTTreasureMaster)
          * **FFTIVC Mod Loader:** [Nenkai/fftivc.utility.modloader](https://github.com/Nenkai/fftivc.utility.modloader/releases)
          * **Patch:** Vibe-coded by me & Google Gemini 🤖
        files: ${{ steps.publish.outputs.zip }}
