name: Build and Release FFT Treasure Master

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version Tag (e.g. v1.5.1, v1.5.2)'
        required: true
        default: 'v1.5.1'
      release_title:
        description: 'Release Title'
        required: false
        default: 'FFT Treasure Master — Compatibility Update'
      custom_notes:
        description: 'What did you fix? (leave blank to use RELEASE_NOTES.md or default notes)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Build and Package
      id: publish
      run: ./Publish.ps1

    - name: Prepare Release Notes
      id: notes
      run: |
        $custom = "${{ github.event.inputs.custom_notes }}".Trim()
        
        if ($custom -ne "") {
            Set-Content -Path "final_notes.md" -Value @"
        $custom

        ---
        ### Credits:
        * **Original Mod:** [prawl/FFTTreasureMaster](https://github.com/prawl/FFTTreasureMaster)
        * **FFTIVC Mod Loader:** [Nenkai/fftivc.utility.modloader](https://github.com/Nenkai/fftivc.utility.modloader/releases)
        * **Fix & Patch:** Vibe-coded by me & Google Gemini 🤖
        "@
        } elseif (Test-Path "RELEASE_NOTES.md") {
            Copy-Item "RELEASE_NOTES.md" "final_notes.md"
        } else {
            Set-Content -Path "final_notes.md" -Value @"
        ### What’s in this release:
        * Compatibility updates and fixes for modern Windows & FFTIVC Mod Loader.

        ---
        ### Credits:
        * **Original Mod:** [prawl/FFTTreasureMaster](https://github.com/prawl/FFTTreasureMaster)
        * **FFTIVC Mod Loader:** [Nenkai/fftivc.utility.modloader](https://github.com/Nenkai/fftivc.utility.modloader/releases)
        * **Fix & Patch:** Vibe-coded by me & Google Gemini 🤖
        "@
        }

    - name: Create GitHub Release & Attach ZIP
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: ${{ github.event.inputs.release_title }}
        body_path: final_notes.md
        files: ${{ steps.publish.outputs.zip }}
        draft: false
        prerelease: false
